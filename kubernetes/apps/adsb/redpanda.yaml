apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: redpanda
  namespace: streaming
spec:
  interval: 24h
  url: https://charts.redpanda.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redpanda
  namespace: streaming
spec:
  interval: 1h
  chart:
    spec:
      chart: redpanda
      version: ">=5.0.0"
      sourceRef:
        kind: HelmRepository
        name: redpanda
        namespace: streaming
  values:
    # Single-node homelab mode (disables production multi-node assertions)
    statefulset:
      replicas: 1
    
    # Storage settings using K3s local-path provisioner
    storage:
      persistentVolume:
        enabled: true
        size: 10Gi
        storageClass: "local-path"

    # Minimal resource footprint
    resources:
      cpu:
        cores: 1
      memory:
        container:
          max: 1.5Gi

    # Disable external listeners/NodePorts; internal cluster networking only
    listeners:
      kafka:
        external:
          default:
            enabled: false

    # Disable Schema Registry and HTTP Proxy to save memory if only using raw Kafka protocol
    schemaRegistry:
      enabled: false
    http:
      enabled: false

    # Disable enterprise/telemetry features
    tuning:
      tune_aio_events: false
    monitoring:
      enabled: false