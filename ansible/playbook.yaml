- name: Wait for Cloud-Init and update apt cache
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Wait for SSH connection
      ansible.builtin.wait_for_connection:
        timeout: 180

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather facts
      ansible.builtin.setup:

    - name: Update apt cache cleanly using public DNS
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 180

- name: Deploy DNS server
  hosts: dns
  become: true
  roles:
    - dnsmasq

- name: Point all VMs to local DNS server
  hosts: all
  become: true
  tasks:
    - name: Configure Netplan to use local DNS server (Debian 13 Cloud-Init default)
      ansible.builtin.copy:
        dest: /etc/netplan/99-custom-dns.yaml
        mode: "0600"
        content: |
          network:
            version: 2
            ethernets:
              ens18:
                nameservers:
                  search: [homelab.local]
                  addresses:
                    - 192.168.1.101
                    - 1.1.1.1
      notify: Apply netplan

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply

- name: Deploy Tailscale
  hosts: tailscale
  become: true
  roles:
    - role: artis3n.tailscale.machine
      vars:
        # Pass via Ansible Vault or environment variable in production
        tailscale_authkey: "{{ tailscale_auth_key }}"
        tailscale_ssh: false
        # Ensure --ssh is removed from extra arguments
        tailscale_args: ""

- name: Install Node-exporter
  hosts: all
  become: true
  roles: 
    - role: prometheus.prometheus.node_exporter

- name: Install Prometheus on RPI-5
  hosts: 
    - monitoring
  become: true
  roles:
    - role: prometheus.prometheus.prometheus
      vars:
        prometheus_targets: 
          node:
            - targets:
                - "192.168.1.98:9100"
                - "192.168.1.99:9100"
                - "192.168.1.101:9100"
                - "192.168.1.102:9100"
                - "192.168.1.103:9100"
                - "192.168.1.104:9100"
                - "192.168.1.105:9100"
                - "192.168.1.106:9100"
                - "localhost:9100"

- name: Install Grafana on RPI-5
  hosts:
    - monitoring
  become: true
  pre_tasks:
    - name: Install required Python libraries for apt modules
      ansible.builtin.apt:
        name:
          - python3-debian
          - python3-apt
        state: present
        update_cache: true
  roles: 
    - role: grafana.grafana.grafana
      vars:
        grafana_cap_net_bind_service: true
        grafana_ini:
          security:
            admin_user: admin
            admin_password: "{{ grafana_password }}"
          server:
            http_port: 80
            domain: "grafana.homelab.local"

        grafana_datasources:
          - name: "Prometheus"
            type: "prometheus"
            access: "proxy"
            url: "https://prometheus.homelab.local"
            isDefault: true
            jsonData:
              timeInterval: "15s"
              tlsSkipVerify: true

        grafana_dashboards:
          - name: "Homelab monitoring"
            dashboard_id: 1860
            datasource: "Prometheus"

- name: Deploy Caddy
  hosts: reverse-proxy
  become: true
  roles: 
    - caddy

- name: Deploy Kubernetes Control plane
  hosts: kube-ctl
  become: true
  roles: 
    - kubernetes-ctl
    - fluxcd

- name: Deploy Kubernetes nodes
  hosts: kube-nodes
  become: true
  roles:
    - kubernetes-nodes
