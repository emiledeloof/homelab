name: Deploy via Local Ansible

on:
  push:
    branches:
      - main

jobs:
  tofu:
    runs-on: self-hosted
    env:
      # Injected via GitHub Repository Secrets for Cloudflare R2
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Sync latest repository code
        run: |
          cd ~/homelab
          git pull origin-ssh main

      - name: Tofu Init
        run: |
          cd ~/homelab/terraform
          tofu init

      - name: Tofu Plan
        run: |
          cd ~/homelab/terraform
          tofu plan -no-color

      - name: Tofu Apply
        run: |
          cd ~/homelab/terraform
          tofu apply -auto-approve -no-color

  deploy:
    runs-on: self-hosted
    needs: tofu

    steps:
      - name: Run Ansible Playbook
        run: |
          cd ~/homelab/ansible
          /home/homelab/.local/bin/ansible-playbook \
            -i inventory.yaml \
            playbook.yaml \
            --vault-password-file ~/.vault_pass