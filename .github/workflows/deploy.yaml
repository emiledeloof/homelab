name: Deploy via Local Ansible

on:
  push:
    branches:
      - main

jobs:
  tofu:
    runs-on: self-hosted
    environment: R2
    env:
      # Injected via GitHub Repository Secrets for Cloudflare R2
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}

    steps:
      - name: Sync latest repository code
        uses: actions/checkout@v4

      - name: Tofu Init
        run: |
          tofu -chdir=terraform init \
          -backend-config="access_key=$AWS_ACCESS_KEY_ID" \
          -backend-config="secret_key=$AWS_SECRET_ACCESS_KEY"

      - name: Tofu Plan
        run: |
          tofu -chdir=terraform plan -no-color

      - name: Tofu Apply
        run: |
          tofu -chdir=terraform apply -auto-approve -no-color

  deploy:
    runs-on: self-hosted
    needs: tofu

    steps:
      - name: Install required collections
        run: |
          ~/.local/bin/ansible-galaxy collection install artis3n.tailscale
          ~/.local/bin/ansible-galaxy collection install prometheus.prometheus
          ~/.local/bin/ansible-galaxy collection install grafana.grafana

      - name: Run Ansible Playbook
        run: |
          ~/.local/bin/ansible-playbook \
            -i ansible/inventory.yaml \
            ansible/playbook.yaml \
            --vault-password-file ~/.vault_pass