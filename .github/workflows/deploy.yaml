name: Deploy via Local Ansible

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout latest repo files
        uses: actions/checkout@v4

      - name: Run Playbook
        run: |
          cd ~/homelab/ansible
          /home/homelab/.local/bin/ansible-playbook -i inventory.yaml playbook.yaml